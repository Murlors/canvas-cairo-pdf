name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: stable
          components: rustfmt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev
      - if: runner.os == 'macOS'
        run: brew install pkgconf cairo pango
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - if: runner.os == 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install python-docx==1.2.0 Pillow==12.3.0
          python tools/make-fixtures.py
          bunx --no-install playwright-core install --with-deps chromium
          bun run render fixtures/multipage.docx chromium
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-pango
      - shell: msys2 {0}
        run: cargo test --workspace --locked
