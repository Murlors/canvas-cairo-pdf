[package]
name = "canvas-cairo-replay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable Cairo/Pango renderer for Canvas JSON recording v1"

[[bin]]
name = "canvas-cairo-pdf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cairo-rs = { version = "0.21", default-features = false, features = ["pdf", "png"] }
pango = { version = "0.21", features = ["v1_44"] }
pangocairo = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lopdf = { version = "0.38", default-features = false }
tempfile = "3"
